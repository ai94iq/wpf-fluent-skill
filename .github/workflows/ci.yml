name: ci

on:
  push:
  workflow_dispatch:

jobs:
  check:
    name: formatting and size budget
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Check skill files
        run: scripts\check-skill.bat

  scaffold:
    name: scaffold, test and package (${{ matrix.ui }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ui: [wpf, winui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Scaffold and test
        run: scripts\new-project.bat CiApp "CI" "${{ runner.temp }}\Ci-${{ matrix.ui }}" --ui ${{ matrix.ui }}
      - name: Check formatting
        run: dotnet format whitespace "${{ runner.temp }}\Ci-${{ matrix.ui }}\CiApp.slnx" --verify-no-changes --no-restore
      - name: Build the MSI
        shell: pwsh
        run: |
          & "${{ runner.temp }}\Ci-${{ matrix.ui }}\package.bat" --no-pause
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msi = Get-ChildItem "${{ runner.temp }}\Ci-${{ matrix.ui }}\artifacts\installer" -Recurse -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw 'package.bat reported success but no MSI was produced.' }
          "MSI: $($msi.FullName) ($([math]::Round($msi.Length / 1MB, 1)) MB)"
